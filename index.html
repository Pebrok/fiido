<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiido T2</title>
<script>
// Safari + extension beacio : charge le script de liaison seulement si le navigateur n'a pas Web Bluetooth.
if (!navigator.bluetooth) document.write('<script src="https://ioswebble.com/webble.js"><\/script>');
</script>
<style>
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  #go { width: 100%; padding: 28px; font-size: 1.4rem; font-weight: 700; border: 0; border-radius: 14px; background: #2e7d4f; color: #fff; }
  #go:disabled { opacity: .5; }
  #st { margin: 14px 0; padding: 14px; border-radius: 10px; background: #1c1c1e; font-size: 1.05rem; }
  .ok { color: #6fdc8c; } .ko { color: #ff6b6b; } .wait { color: #e0b84a; }
  #log { white-space: pre-wrap; font: 12px ui-monospace, monospace; color: #999; background: #1c1c1e; border-radius: 10px; padding: 10px; max-height: 40vh; overflow: auto; }
  #cp { margin-top: 10px; padding: 12px; width: 100%; border: 0; border-radius: 10px; background: #2c2c2e; color: #eee; font-size: 1rem; }
</style>
</head>
<body>
<h1>Fiido T2</h1>
<button id="go">Débrider le vélo</button>
<div id="st">Vélo allumé, app Fiido fermée. Appuie, puis choisis « Fiido_T2 ».</div>
<div id="log"></div>
<button id="cp">Copier le journal</button>

<script>
const $ = id => document.getElementById(id);
const SVC = '00010203-0405-0607-0809-0a0b0c0dffe0';
const SVC2 = '0000fe59-0000-1000-8000-00805f9b34fb';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hex = u => [...u].map(b => b.toString(16).padStart(2, '0')).join(' ');
const t0 = () => new Date().toISOString().slice(11, 23);
let text = 'Fiido T2 simple | ' + new Date().toISOString() + '\n' + navigator.userAgent + '\n';
function log(m) { const l = '[' + t0() + '] ' + m; text += l + '\n'; $('log').textContent += l + '\n'; $('log').scrollTop = 1e9; }
function status(m, c) { $('st').className = c || ''; $('st').textContent = m; }
function err(e) { return e && e.name ? e.name + ' : ' + (e.message || '') : 'code ' + e; }

// Trames : dernier octet = XOR des précédents. Enveloppe 19 octets comme la v2.3 qui a fonctionné.
function frame(b) { let x = 0; for (const v of b) x ^= v; return new Uint8Array([...b, x]); }
function wrap(v) { const att = 3 + v.length; return new Uint8Array([0x02, 0x41, 0x00, 4 + att, 0x00, att, 0x00, 0x04, 0x00, 0x52, 0x10, 0x00, ...v]); }
const A = wrap(frame([0x46, 0x64, 0xaa, 0x01, 0x2c, 0x61]));
const B = wrap(frame([0x46, 0x64, 0xaa, 0x01, 0x27, 0x80]));

async function write(c, data, name) {
  if (c.properties.writeWithoutResponse && c.writeValueWithoutResponse) await c.writeValueWithoutResponse(data);
  else await c.writeValue(data);
  log('Envoi ' + name + ' : ' + hex(data));
}

async function run() {
  $('go').disabled = true;
  try {
    if (!navigator.bluetooth) throw new Error('Web Bluetooth indisponible dans ce navigateur (Bluefy, ou Safari avec beacio activé).');
    status('Choisis « Fiido_T2 » dans la liste…', 'wait');
    // Bluefy refuse les listes de services (code 2) ; l'extension Safari en a besoin.
    const opts = /Bluefy/.test(navigator.userAgent) ? { acceptAllDevices: true } : { acceptAllDevices: true, optionalServices: [SVC, SVC2] };
    const dev = await navigator.bluetooth.requestDevice(opts);
    log('Appareil : ' + (dev.name || '?'));
    status('Connexion…', 'wait');
    const srv = await dev.gatt.connect();
    const svcs = await srv.getPrimaryServices();
    let wc = null, nc = null;
    for (const s of svcs) {
      log('Service ' + s.uuid);
      for (const c of await s.getCharacteristics()) {
        log('  ' + c.uuid + (c.properties.write ? ' W' : '') + (c.properties.writeWithoutResponse ? ' w' : '') + (c.properties.notify ? ' N' : ''));
        if (!wc && (c.properties.write || c.properties.writeWithoutResponse)) wc = c;
        if (!nc && s.uuid === SVC && c.properties.notify) nc = c;
      }
    }
    if (!wc) throw new Error('Aucune caractéristique écrivable trouvée.');
    log('Écriture sur ' + wc.uuid);
    if (nc) { try { await nc.startNotifications(); } catch (e) { log('Notifications : ' + err(e)); } }
    status('Envoi A…', 'wait');
    await sleep(1000);
    await write(wc, A, 'A');
    await sleep(1500);
    status('Envoi B…', 'wait');
    await write(wc, B, 'B');
    status('✔ Envoyé. Essaie l\'accélérateur.', 'ok');
  } catch (e) {
    log('✖ ' + err(e));
    status('✖ ' + err(e), 'ko');
  }
  $('go').disabled = false;
}
$('go').addEventListener('click', run);
$('cp').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(text); $('cp').textContent = 'Copié ✔'; }
  catch (e) { $('cp').textContent = 'Copie impossible : sélectionne le journal à la main'; }
});
</script>
</body>
</html>

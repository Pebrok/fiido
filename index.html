<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiido T2 Bluefy Full Sequence</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 1.2rem;
            border-radius: 8px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h1 { font-size: 1.2rem; margin-top: 0; color: #f0f6fc; text-align: center; }
        .version { font-size: 0.75rem; color: #8b949e; margin-bottom: 1rem; text-align: center; }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 15px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-weight: 600;
        }
        button:hover { background-color: #2ea043; }
        button.secondary {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        button.secondary:hover { background-color: #30363d; }
        #log-box {
            margin-top: 15px;
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
            font-size: 0.7rem;
            height: 220px;
            overflow-y: auto;
            color: #7ee787;
            word-break: break-all;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Fiido T2 Full Unlock</h1>
        <div class="version">Version : v2.6-sequential</div>
        
        <button id="runBtn">Lancer la séquence complète</button>
        
        <div id="log-box">[Prêt] En attente de connexion via Bluefy...</div>
        
        <button id="copyBtn" class="secondary">Copier les logs</button>
    </div>

    <script>
        const logBox = document.getElementById('log-box');
        const copyBtn = document.getElementById('copyBtn');

        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let color = '#7ee787';
            if (type === 'error') color = '#ff7b72';
            if (type === 'warn') color = '#d29922';
            if (type === 'blue') color = '#58a6ff';

            logBox.innerHTML += `<div style="color: ${color};">[${time}] ${message}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(logBox.innerText).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copié !";
                setTimeout(() => { copyBtn.innerText = originalText; }, 2000);
            });
        });

        document.getElementById('runBtn').addEventListener('click', async () => {
            logBox.innerHTML = "";
            log("=== DÉBUT SÉQUENCE COMPLÈTE (v2.6) ===", "blue");

            if (!navigator.bluetooth) {
                log("ERREUR : Web Bluetooth non disponible.", "error");
                return;
            }

            try {
                log("1. Association Bluetooth (Fiido)...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Fiido' }],
                    optionalServices: [0xFFE0, '0000ffe0-0000-1000-8000-00805f9b34fb']
                });
                log(Appareil : ${device.name}, "blue");

                log("2. Connexion GATT...");
                const server = await device.gatt.connect();
                
                log("3. Accès au service FFE0 et caractéristique FFE1...");
                const service = await server.getPrimaryService(0xFFE0);
                const characteristic = await service.getCharacteristic(0xFFE1);

                // Étape A : Trame de déclenchement du mode debug / saisie du code
                log("4. Envoi de la trame d'accès au mode debug...", "blue");
                const payloadAuth = new Uint8Array([
                    0x02, 0x41, 0x00, 0x0e, 0x00, 0x0a, 0x00, 0x04, 0x00, 
                    0x52, 0x10, 0x00, 0x46, 0x64, 0xaa, 0x01, 0x2c, 0x61, 0xc4
                ]);
                await characteristic.writeValueWithoutResponse(payloadAuth);

                // Pause pour laisser le contrôleur valider l'entrée du code
                await new Promise(resolve => setTimeout(resolve, 400));

                // Étape B : Trame de sélection du mode "sans limite" (vitesse maximale)
                log("5. Envoi de la trame 'sans limite'...", "blue");
                const payloadUnlimited = new Uint8Array([
                    0x02, 0x41, 0x00, 0x0e, 0x00, 0x0a, 0x00, 0x04, 0x00, 
                    0x52, 0x10, 0x00, 0x46, 0x64, 0xaa, 0x01, 0x40, 0x75, 0xd8
                ]);
                await characteristic.writeValueWithoutResponse(payloadUnlimited);

                log("Succès : Séquence séquentielle transmise avec succès !", "blue");

            } catch (err) {
                log(`ERREUR : ${err.name} -> ${err.message}`, "error");
            }
        });
    </script>
</body>
</html>

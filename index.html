<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiido T2 Direct</title>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 8px 0; color: #ffffff; }
    p { color: #8b949e; font-size: 14px; margin-bottom: 20px; }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
    }
    .status-box {
      margin-top: 15px;
      padding: 12px;
      background: #0d1117;
      border-radius: 8px;
      border: 1px solid #21262d;
      font-family: monospace;
      font-size: 13px;
      color: #c9d1d9;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Fiido T2 Unlock</h1>
    <p>Envoi Direct Payload BLE</p>

    <button class="btn" onclick="debrider()">⚡ Débloquer la vitesse</button>

    <div id="status" class="status-box">Statut : Prêt</div>
  </div>

  <script>
    async function debrider() {
      const statusDiv = document.getElementById('status');
      statusDiv.style.color = '#58a6ff';
      statusDiv.innerText = 'Connexion au vélo...';

      const SERVICE_UUID = '0000fe00-0000-1000-8000-00805f9b34fb';
      const CHAR_UUID = '0000fe01-0000-1000-8000-00805f9b34fb';

      try {
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID, 0xfe00]
        });

        statusDiv.innerText = 'Connexion GATT...';
        const server = await device.gatt.connect();

        statusDiv.innerText = 'Obtention du service...';
        const service = await server.getPrimaryService(SERVICE_UUID);

        statusDiv.innerText = 'Accès à la caractéristique...';
        const characteristic = await service.getCharacteristic(CHAR_UUID);

        statusDiv.innerText = 'Envoi de la commande...';
        const payload = new Uint8Array([0x46, 0x64, 0x55, 0x06, 0x2d, 0x5c]);
        
        try {
          await characteristic.writeValueWithoutResponse(payload);
        } catch (e) {
          await characteristic.writeValue(payload);
        }

        statusDiv.style.color = '#3fb950';
        statusDiv.innerText = '✅ Commande envoyée !';

      } catch (error) {
        statusDiv.style.color = '#f85149';
        statusDiv.innerText = 'Erreur : ' + (error.message || error);
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiido T2 Ultimate Diagnostic & Unblocker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 1.2rem;
            border-radius: 8px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h1 { font-size: 1.2rem; margin-top: 0; color: #f0f6fc; text-align: center; }
        .version { font-size: 0.75rem; color: #8b949e; margin-bottom: 1rem; text-align: center; }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-weight: 600;
        }
        button:hover { background-color: #2ea043; }
        button.secondary {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        button.secondary:hover { background-color: #30363d; }
        #log-box {
            margin-top: 15px;
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
            font-size: 0.7rem;
            height: 220px;
            overflow-y: auto;
            color: #7ee787;
            word-break: break-all;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Fiido T2 Diagnostic Pro</h1>
        <div class="version">Version : v2.2-pro-diagnostic</div>
        
        <button id="runBtn">Lancer l'audit & le débridage</button>
        
        <div id="log-box">[Prêt] En attente de connexion au vélo...</div>
        
        <button id="copyBtn" class="secondary">Copier les logs</button>
    </div>

    <script>
        const logBox = document.getElementById('log-box');
        const copyBtn = document.getElementById('copyBtn');

        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let color = '#7ee787'; // Vert
            if (type === 'error') color = '#ff7b72'; // Rouge
            if (type === 'warn') color = '#d29922';  // Orange
            if (type === 'blue') color = '#58a6ff';  // Bleu

            logBox.innerHTML += `<div style="color: ${color};">[${time}] ${message}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        copyBtn.addEventListener('click', () => {
            const textToCopy = logBox.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copié dans le presse-papier !";
                setTimeout(() => { copyBtn.innerText = originalText; }, 2000);
            }).catch(err => {
                alert("Erreur lors de la copie : " + err);
            });
        });

        document.getElementById('runBtn').addEventListener('click', async () => {
            logBox.innerHTML = "";
            log("=== DÉBUT DU DIAGNOSTIC T2 (v2.2) ===", "blue");

            if (!navigator.bluetooth) {
                log("ERREUR : Web Bluetooth non disponible. Utilisez Chrome ou Bluefy.", "error");
                return;
            }

            try {
                log("1. Recherche du périphérique 'Fiido'...");
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '0000ffe0-0000-1000-8000-00805f9b34fb', 
                        'ffe0', 
                        '0000ffe1-0000-1000-8000-00805f9b34fb',
                        'ffe1'
                    ]
                });
                log(`Trouvé : ${device.name} [ID: ${device.id}]`, "blue");

                log("2. Connexion au serveur GATT...");
                const server = await device.gatt.connect();
                log("Connecté avec succès au serveur GATT.", "blue");

                log("3. Récupération de tous les services disponibles...");
                const services = await server.getPrimaryServices();
                log(`Nombre de services trouvés : ${services.length}`, "blue");

                let targetService = null;
                for (let s of services) {
                    log(` -> Service UUID trouvé : ${s.uuid}`, "blue");
                    // On prend le premier service ou celui qui correspond au ffe0
                    if (s.uuid.includes('ffe0') || !targetService) {
                        targetService = s;
                    }
                }

                if (!targetService) {
                    throw new Error("Aucun service compatible trouvé sur le vélo.");
                }

                log(`Service sélectionné : ${targetService.uuid}`, "blue");

                log("4. Scan de toutes les caractéristiques du service...");
                const characteristics = await targetService.getCharacteristics();
                let targetChar = null;

                characteristics.forEach(char => {
                    let props = [];
                    if (char.properties.read) props.push("READ");
                    if (char.properties.write) props.push("WRITE");
                    if (char.properties.writeWithoutResponse) props.push("WRITE_NO_RESP");
                    if (char.properties.notify) props.push("NOTIFY");
                    log(` -> Caractéristique: ${char.uuid} [ ${props.join(', ')} ]`, "blue");

                    // On cherche en priorité la caractéristique ffe1 ou une qui permet l'écriture sans réponse
                    if (char.uuid.includes('ffe1') || char.properties.writeWithoutResponse) {
                        targetChar = char;
                    }
                });

                if (!targetChar && characteristics.length > 0) {
                    targetChar = characteristics[0]; // Fallback sur la première dispo
                }

                if (!targetChar) {
                    throw new Error("Aucune caractéristique d'écriture trouvée.");
                }

                log(`Caractéristique cible validée : ${targetChar.uuid}`, "blue");

                if (targetChar.properties.notify) {
                    await targetChar.startNotifications();
                    targetChar.addEventListener('characteristicvaluechanged', (e) => {
                        const hex = [...new Uint8Array(e.target.value.buffer)]
                            .map(b => b.toString(16).padStart(2, '0')).join(' ');
                        log(`[REÇU DU VÉLO - RX] ${hex}`, "warn");
                    });
                    log("Écoute des notifications activée.", "blue");
                }

                log("5. Injection de la trame de débridage capturée (19 octets)...");
                const payload = new Uint8Array([
                    0x02, 0x41, 0x00, 0x0e, 0x00, 0x0a, 0x00, 0x04, 0x00, 
                    0x52, 0x10, 0x00, 0x46, 0x64, 0xaa, 0x01, 0x2c, 0x61, 0xc4
                ]);

                if (targetChar.properties.writeWithoutResponse) {
                    await targetChar.writeValueWithoutResponse(payload);
                    log("Trame envoyée via WRITE_NO_RESP avec succès !", "blue");
                } else if (targetChar.properties.write) {
                    await targetChar.writeValueWithResponse(payload);
                    log("Trame envoyée via WRITE (avec réponse) avec succès !", "blue");
                } else {
                    throw new Error("La caractéristique sélectionnée ne permet pas l'écriture.");
                }

                log("=== AUDIT TERMINÉ AVEC SUCCÈS ===", "blue");

            } catch (err) {
                log(`ERREUR CRITIQUE : ${err.name} -> ${err.message}`, "error");
            }
        });
    </script>
</body>
</html>

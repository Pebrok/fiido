<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiido T2 Ultimate Diagnostic & Unblocker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 1.2rem;
            border-radius: 8px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h1 { font-size: 1.2rem; margin-top: 0; color: #f0f6fc; text-align: center; }
        .version { font-size: 0.75rem; color: #8b949e; margin-bottom: 1rem; text-align: center; }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-weight: 600;
        }
        button:hover { background-color: #2ea043; }
        button:disabled { background-color: #21262d; color: #484f58; cursor: not-allowed; }
        #log-box {
            margin-top: 15px;
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
            font-size: 0.7rem;
            height: 240px;
            overflow-y: auto;
            color: #7ee787;
            word-break: break-all;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Fiido T2 Diagnostic Pro</h1>
        <div class="version">Version : v2.0-pro-diagnostic</div>
        
        <button id="runBtn">Lancer l'audit & le débridage</button>
        
        <div id="log-box">[Prêt] En attente de connexion au vélo...</div>
    </div>

    <script>
        const logBox = document.getElementById('log-box');

        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let color = '#7ee787'; // Vert par défaut
            if (type === 'error') color = '#ff7b72'; // Rouge
            if (type === 'warn') color = '#d29922';  // Orange
            if (type === 'blue') color = '#58a6ff';  // Bleu

            logBox.innerHTML += `<div style="color: ${color};">[${time}] ${message}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // UUIDs standards identifiés
        const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb"; 
        const CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";

        document.getElementById('runBtn').addEventListener('click', async () => {
            logBox.innerHTML = "";
            log("=== DÉBUT DU DIAGNOSTIC T2 ===", "blue");

            if (!navigator.bluetooth) {
                log("ERREUR : Web Bluetooth non disponible. Utilisez Chrome (Android/PC) ou Bluefy (iOS).", "error");
                return;
            }

            try {
                log("1. Recherche du périphérique 'Fiido'...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Fiido' }],
                    optionalServices: [SERVICE_UUID]
                });
                log(`Trouvé : ${device.name} [ID: ${device.id}]`, "blue");

                log("2. Connexion au serveur GATT...");
                const server = await device.gatt.connect();
                log("Connecté avec succès au serveur GATT.", "blue");

                log("3. Récupération du service primaire (0ffe0)...");
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                log("4. Scan de toutes les caractéristiques du service...");
                const characteristics = await service.getCharacteristics();
                characteristics.forEach(char => {
                    let props = [];
                    if (char.properties.read) props.push("READ");
                    if (char.properties.write) props.push("WRITE");
                    if (char.properties.writeWithoutResponse) props.push("WRITE_NO_RESP");
                    if (char.properties.notify) props.push("NOTIFY");
                    log(` -> UUID: ${char.uuid} [ ${props.join(', ')} ]`, "blue");
                });

                log("5. Ciblage de la caractéristique principale (0ffe1 / Handle 0x0010)...");
                const targetChar = await service.getCharacteristic(CHARACTERISTIC_UUID);

                // Activer l'écoute des retours (notifications) si supporté
                if (targetChar.properties.notify) {
                    await targetChar.startNotifications();
                    targetChar.addEventListener('characteristicvaluechanged', (e) => {
                        const hex = [...new Uint8Array(e.target.value.buffer)]
                            .map(b => b.toString(16).padStart(2, '0')).join(' ');
                        log(`[REÇU DU VÉLO - RX] ${hex}`, "warn");
                    });
                    log("Écoute des notifications activée.", "blue");
                }

                log("6. Injection de la trame de débridage capturée (19 octets)...");
                const payload = new Uint8Array([
                    0x02, 0x41, 0x00, 0x0e, 0x00, 0x0a, 0x00, 0x04, 0x00, 
                    0x52, 0x10, 0x00, 0x46, 0x64, 0xaa, 0x01, 0x2c, 0x61, 0xc4
                ]);

                if (targetChar.properties.writeWithoutResponse) {
                    await targetChar.writeValueWithoutResponse(payload);
                    log("Trame envoyée via WRITE_NO_RESP avec succès !", "blue");
                } else if (targetChar.properties.write) {
                    await targetChar.writeValueWithResponse(payload);
                    log("Trame envoyée via WRITE (avec réponse) avec succès !", "blue");
                } else {
                    throw new Error("La caractéristique ne permet aucune méthode d'écriture !");
                }

                log("=== AUDIT TERMINÉ : Observez la réaction du vélo ===", "blue");

            } catch (err) {
                log(`ERREUR CRITIQUE : ${err.name} -> ${err.message}`, "error");
                if (err.name === 'NotFoundError') {
                    log("Conseil : Aucun vélo sélectionné ou appairage annulé.", "warn");
                } else if (err.name === 'SecurityError') {
                    log("Conseil : Problème HTTPS ou permissions Bluetooth refusées par l'OS.", "warn");
                } else {
                    log("Conseil : Le vélo est peut-être déjà lié à l'application officielle en arrière-plan.", "warn");
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiido T2 Unblocker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff; }
        .version { font-size: 0.85rem; color: #888; margin-bottom: 1.5rem; }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #4b5563; cursor: not-allowed; }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            word-break: break-all;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Fiido T2 Control</h1>
        <div class="version" id="app-version">Version : v1.2.0-beta</div>
        
        <button id="connectBtn">Connecter & Débrider</button>
        <div id="status">En attente de connexion...</div>
    </div>

    <script>
        // Numéro de version affiché pour suivi
        const VERSION = "v1.2.0-beta";
        console.log("Fiido T2 Script - " + VERSION);

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        // UUIDs standard ou découverts pour le canal d'écriture
        const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb"; 
        const CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb"; // Correspond au handle 0x0010

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = "Recherche du Fiido T2...";
                statusDiv.className = "";

                // Demande l'association Bluetooth (filtré par nom)
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Fiido' }],
                    optionalServices: [SERVICE_UUID]
                });

                statusDiv.textContent = "Connexion au GATT...";
                const server = await device.gatt.connect();
                
                statusDiv.textContent = "Recherche du service...";
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                statusDiv.textContent = "Accès à la caractéristique...";
                const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusDiv.textContent = "Envoi de la commande de débridage (Code 398219)...";

                // Séquence complète extraite de vos captures de logs (incluant l'en-tête et la payload variable)
                const payload = new Uint8Array([
                    0x02, 0x41, 0x00, 0x0e, 0x00, 0x0a, 0x00, 0x04, 0x00, 
                    0x52, 0x10, 0x00, 0x46, 0x64, 0xaa, 0x01, 0x2c, 0x61, 0xc4
                ]);

                // Envoi de la commande sans accusé de réception (Write Command)
                await characteristic.writeValueWithoutResponse(payload);

                statusDiv.textContent = "Succès : Vélo débridé ! (" + VERSION + ")";
                statusDiv.className = "success";

                // Déconnexion propre après un court délai
                setTimeout(() => {
                    if (server.connected) {
                        server.disconnect();
                    }
                }, 1000);

            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Erreur : " + error.message;
                statusDiv.className = "error";
            }
        });
    </script>
</body>
</html>
